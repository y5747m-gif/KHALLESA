name: Build APK (KHALLESA)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate PWA icons
        run: npm run icons

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Sync app version from package.json
        run: |
          V=$(node -p "require('./package.json').version")
          C=$(git rev-list --count HEAD)
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode $C/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk khallesa.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khallesa-apk
          path: khallesa.apk
          retention-days: 30

      # Rolling release → stable download URL used by the in-app "حمّل APK" button:
      # https://github.com/y5747m-gif/KHALLESA/releases/download/latest-apk/khallesa.apk
      - name: Publish rolling APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk khallesa.apk \
            --title "خَلِّصها APK — آخر بناء (v$V)" \
            --prerelease \
            --notes "آخر نسخة APK مبنية تلقائيًا من الفرع الرئيسي (v$V).

          ثبّتها على أندرويد: حمّل \`khallesa.apk\` ← افتح الملف ← «تثبيت» ← سمح بـ«مصدر غير معروف» لمرة واحدة.

          كل البيانات محفوظة على جهازك فقط."

      - name: Rename for versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp khallesa.apk khallesa-${{ github.ref_name }}.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            khallesa.apk
            khallesa-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
