name: Build APK (KHALLESA)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3 || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khallesa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp android/app/build/outputs/apk/debug/app-debug.apk khallesa-${{ github.ref_name }}.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: khallesa-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: ${{ runner.temp }}/gradle.log
          retention-days: 7

      - name: Report failure to debug issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = `${process.env.RUNNER_TEMP}/gradle.log`;
            let report = '(no log file)';
            try {
              const lines = fs.readFileSync(logPath, 'utf8').split('\n');
              const out = [];
              lines.forEach((l, i) => {
                if (/What went wrong|Execution failed for task|> Task .+ FAILED|Caused by:|\berror:|FAILED$|BUILD FAILED|invalid (source|target) release|cannot find symbol|package .* does not exist|Duplicate /.test(l)) {
                  out.push(`--- line ${i} ---`);
                  for (let j = Math.max(0, i - 1); j <= Math.min(lines.length - 1, i + 6); j++) out.push(lines[j]);
                }
              });
              report = out.join('\n').slice(0, 20000) || lines.slice(-120).join('\n');
            } catch (e) {
              report = `(could not read log: ${e.message})`;
            }
            const title = 'CI debug: APK build failure';
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `## Build failed\nRun: ${runUrl}\nBranch: \`${context.ref}\` @ \`${context.sha.slice(0, 7)}\`\n\n<details><summary>failure lines</summary>\n\n\`\`\`\n${report}\n\`\`\`\n</details>`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 50 });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
